name: Devops CICD

on:
    push:
        branches:
            - main
        paths-ignore:
            - ./manifests
jobs:
    devops-ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Docker login
              uses: docker/login-action@v4.2.0
              with:
                username: ${{ secrets.DOCKER_USERNAME}}
                password: ${{ secrets.DOCKER_TOKEN}}

            - name: Build and push Docker images
              uses: docker/build-push-action@v7.2.0
              with:
                file: 
                tags: "isuru91/devopspython:${{github.sha}}"
                push: true
            
            - name:  Updating image tags in Kubernetes manifests files
              run: |
                pip install yq
                yq -Yi '.spec.template.spec.containers[0].image = "isuru91/devopspython:${{github.sha}}"' ./manifests/02_devopsdep.yaml

            - name:  Commit and push changes to Kubernetes manifests files
              run: |
                git config --global user.name "isuru91"
                git config --global user.email "udithsenanayake@gmail.com"
                git add ./manifests/02_devopsdep.yaml
                git commit -am "Updated image tags in Kubernetes manifests files"
                git push origin HEAD:main

                    
              




            

